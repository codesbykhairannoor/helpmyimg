name: Daily Google Indexing Push

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  google-index:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Google Indexing API Push
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/submit-google-indexing-api.mjs
