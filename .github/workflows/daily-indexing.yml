name: Manual Google Indexing Push (Daily Cron Disabled)

on:
  workflow_dispatch:
    # Manual trigger only from GitHub Actions tab

jobs:
  google-index:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Google Indexing API Push
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/submit-google-indexing-api.mjs
